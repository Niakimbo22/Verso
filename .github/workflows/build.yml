name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Version fixée : ubuntu-latest migre vers Ubuntu 26 en octobre 2026.
    runs-on: ubuntu-24.04
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # L'AAR en base64 dépasse la limite de 48 Ko d'un secret GitHub : il est coupé
      # en deux secrets (_1 puis _2), recollés ici. Un secret unique reste accepté.
      - name: SDK Glyph (optionnel)
        env:
          AAR_PART_1: ${{ secrets.GLYPH_SDK_AAR_BASE64_1 }}
          AAR_PART_2: ${{ secrets.GLYPH_SDK_AAR_BASE64_2 }}
          AAR_FULL: ${{ secrets.GLYPH_SDK_AAR_BASE64 }}
        run: |
          DATA="${AAR_FULL:-${AAR_PART_1}${AAR_PART_2}}"
          if [ -z "$DATA" ]; then
            echo "Secrets GLYPH_SDK_AAR_BASE64_1/_2 absents : build sans SDK Glyph (contrôleur factice)."
            exit 0
          fi
          mkdir -p app/libs
          AAR=app/libs/glyph-matrix-sdk-2.0.aar
          # Ne garde que les caractères base64 (retire espaces, retours ligne, BOM, guillemets…).
          P1=$(printf '%s' "$AAR_PART_1" | tr -cd 'A-Za-z0-9+/=')
          P2=$(printf '%s' "$AAR_PART_2" | tr -cd 'A-Za-z0-9+/=')
          CLEAN=$(printf '%s' "$DATA" | tr -cd 'A-Za-z0-9+/=')
          printf '%s' "$CLEAN" | base64 -d > "$AAR" 2>/dev/null || true
          SHA=$(sha256sum "$AAR" | cut -d' ' -f1)
          # Empreinte de glyph-matrix-sdk-2.0.aar (GlyphMatrix-Developer-Kit, branche main).
          EXPECTED=be00ee9cd7115f6b11984c6e31fe98e298fb726940d1555063610685ef3bbf29
          if [ "$SHA" != "$EXPECTED" ]; then
            echo "::error::AAR Glyph invalide. Longueurs : _1=${#P1}, _2=${#P2} (attendu 39172 chacun), total=${#CLEAN} (attendu 78344), fichier=$(stat -c%s "$AAR") octets (attendu 58757), sha256=${SHA:0:16}."
            exit 1
          fi
          echo "AAR Glyph installé ($(stat -c%s "$AAR") octets, empreinte vérifiée)."

      - name: Keystore de signature (optionnel)
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.SIGNING_ALIAS }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ] && [ -n "$SIGNING_PASSWORD" ] && [ -n "$SIGNING_ALIAS" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/verso.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/verso.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Secrets de signature absents : signature debug, aucune Release ne sera publiée."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK release
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.SIGNING_ALIAS }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk "verso-v${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: verso-v${{ env.VERSION }}
          path: verso-v${{ env.VERSION }}.apk

      - name: Publier la Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" "verso-v${VERSION}.apk" \
            --title "Verso v${VERSION}" \
            --notes "Build automatique du commit ${GITHUB_SHA}." \
            --target "${GITHUB_SHA}"

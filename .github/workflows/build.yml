name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: SDK Glyph (optionnel)
        env:
          GLYPH_SDK_AAR_BASE64: ${{ secrets.GLYPH_SDK_AAR_BASE64 }}
        run: |
          if [ -n "$GLYPH_SDK_AAR_BASE64" ]; then
            mkdir -p app/libs
            echo "$GLYPH_SDK_AAR_BASE64" | base64 -d > app/libs/glyph-matrix-sdk-2.0.aar
            echo "AAR Glyph installé."
          else
            echo "Secret GLYPH_SDK_AAR_BASE64 absent : build sans SDK Glyph."
          fi

      - name: Keystore de signature (optionnel)
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.SIGNING_ALIAS }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ] && [ -n "$SIGNING_PASSWORD" ] && [ -n "$SIGNING_ALIAS" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/verso.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/verso.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Secrets de signature absents : signature debug, aucune Release ne sera publiée."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK release
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.SIGNING_ALIAS }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk "verso-v${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: verso-v${{ env.VERSION }}
          path: verso-v${{ env.VERSION }}.apk

      - name: Publier la Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" "verso-v${VERSION}.apk" \
            --title "Verso v${VERSION}" \
            --notes "Build automatique du commit ${GITHUB_SHA}." \
            --target "${GITHUB_SHA}"
